[project]
name = "falcondale"
version = "0.3.0"
description = "Quantum machine learning for computer scientists: feature selection, classification and clustering with a scikit-learn feel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Falcondale", email = "info@falcondale.pro" }]
requires-python = ">=3.11,<3.14"
keywords = ["quantum computing", "quantum machine learning", "qiskit", "pennylane", "qubo", "feature selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
# The core is kept small, each family of quantum techniques lives in its own extra
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
feature-selection = [
    "dimod>=0.12.22",
    "dwave-samplers>=1.8.0",
    # qiskit 2.6.0 needs ~1.5KB of static TLS and, together with the libgomp copies shipped by
    # torch and scikit-learn, fails to import on glibc ("cannot allocate memory in static TLS block")
    "qiskit>=2.4,<2.6",
    "simulated-bifurcation>=2.0.0",
    "torch>=2.6",
]
qml = [
    "pennylane>=0.45.1",
    "qiskit>=2.4,<2.6",
    "qiskit-machine-learning>=0.9.1",
    "torch>=2.6",
]
# APQC relies on TensorFlow, Qiskit builds the interference circuits of quantum k-means
clustering = ["apqc>=0.2.0", "qiskit>=2.4,<2.6"]
all = ["falcondale[feature-selection,qml,clustering]"]

[project.urls]
Homepage = "https://github.com/Falcondale/falcondale-sdk"
Documentation = "https://falcondale.readthedocs.io/"
Issues = "https://github.com/Falcondale/falcondale-sdk/issues"
Changelog = "https://github.com/Falcondale/falcondale-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    # Development needs every extra (type checking, tests), so `uv sync` installs them all
    "falcondale[all]",
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.9",
]
notebook = ["ipykernel>=6.29", "matplotlib>=3.9", "seaborn>=0.13"]

[tool.uv]
default-groups = ["dev"]

# CPU wheels keep the development environment light. This only applies to uv
# installs from this repository, published metadata keeps the plain `torch` requirement.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.ipynb" = ["E501", "B018"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: quantum simulations that take more than a few seconds"]
filterwarnings = [
    "ignore::DeprecationWarning:pennylane.*",
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:gast.*",  # TensorFlow autograph on Python 3.13
]

[tool.coverage.run]
source = ["falcondale"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true
