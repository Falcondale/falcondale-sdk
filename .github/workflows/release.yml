name: Release

# Merging a pull request from develop into main releases a new version:
# commitizen bumps the version from the conventional commits, updates CHANGELOG.md
# and tags it, then the package is published to PyPI and a GitHub release is created.
# If a release stops after the tag was pushed, run the workflow manually with that tag
# to bring it back to develop, publish it and create the GitHub release.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.4.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  COMMITIZEN_VERSION: "4.19.2"

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # The workflow token cannot bypass the required checks of develop, so the release
          # commit is pushed with a deploy key with write access, a bypass actor of the rulesets
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version and update changelog
        id: bump
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cz() { uvx --from "commitizen==${COMMITIZEN_VERSION}" cz "$@"; }
          if [ -n "$TAG" ]; then
            git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || { echo "::error::Tag $TAG not found"; exit 1; }
            cz changelog "$TAG" --dry-run > release-notes.md
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0)
          # 3: no commits since the last release, 21: none of them requires a new version
          cz --no-raise 3,21 bump --yes
          current=$(git describe --tags --abbrev=0)
          if [ "$previous" = "$current" ]; then
            echo "::notice::No releasable changes since $previous"
            exit 0
          fi
          cz changelog "$current" --dry-run > release-notes.md
          git push origin main "$current"
          echo "tag=$current" >> "$GITHUB_OUTPUT"
      - name: Bring the release commit back to develop
        if: steps.bump.outputs.tag
        run: |
          git fetch origin develop
          git switch develop
          git merge --no-edit origin/main
          git push origin develop
      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.tag
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: bump
    if: needs.bump.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    # Trusted publishing, configure it at https://pypi.org/manage/project/falcondale/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/project/falcondale/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv publish --trusted-publishing always

  github-release:
    needs: [bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create GitHub release
        run: |
          gh release create "$TAG" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file artifacts/release-notes/release-notes.md \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
